server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx doesn't know the .apk MIME type by default - without this it
    # falls back to application/octet-stream, which still downloads fine in
    # most browsers, but some flag it as untrusted more aggressively.
    types {
        application/vnd.android.package-archive apk;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
    }
}
